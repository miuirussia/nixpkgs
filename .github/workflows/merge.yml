name: Merge upstream branches
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          path: nixpkgs-final
      - uses: actions/checkout@v2
        with:
          path: nixpkgs-original
          repository: NixOS/nixpkgs
          ref: nixpkgs-unstable
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          persist-credentials: true
      - name: Install nix
        uses: miuirussia/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          install_url: https://github.com/miuirussia/nix-unstable-installer/releases/latest/download/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            substituters = https://cache.iog.io https://cache.nixos.org/
            trusted-public-keys = cache.iog.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - name: Merge upstream
        run: |
          set -x

          pushd ./nixpkgs-original
          git apply -v ../nixpkgs-final/patches/*.patch
          popd
          for item in 'doc' 'ci' 'lib' 'maintainers' 'nixos' 'pkgs' 'modules';
          do
            rsync -au --delete ./nixpkgs-original/$item/ ./nixpkgs-final/$item
          done
          cp -f ./nixpkgs-original/{.editorconfig,.git-blame-ignore-revs,.gitattributes,.gitignore,.version,CONTRIBUTING.md,COPYING,README.md,default.nix,flake.nix} ./nixpkgs-final

          (cd ./nixpkgs-final && ./pkgs/applications/editors/vscode/update-vscode.sh)
          (cd ./nixpkgs-final && ./pkgs/applications/editors/vscode/update-vscodium.sh)
          (cd ./nixpkgs-final && ./pkgs/development/python-modules/playwright/update.sh)
          # (cd ./nixpkgs-final && nix-build . -A tree-sitter.passthru.updateScript --no-out-link)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push changes
        run: |
          set -x

          cd ./nixpkgs-final

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          STATUS=$(git status -s)
          if [ -n "$STATUS" ]; then
              git add .
              git commit -m "$(date) automatic merge"
              git push origin nixpkgs-unstable
          fi
